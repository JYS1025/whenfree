<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" style="background:#09090b; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="gold-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background container -->
  <rect width="1200" height="480" fill="#09090b"/>
  <rect x="20" y="20" width="1160" height="440" rx="16" fill="url(#bg-grad)" stroke="#27272a" stroke-width="1.5"/>

  <!-- Left Hero Typography -->
  <g transform="translate(60, 80)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="26" rx="6" fill="#064e3b" fill-opacity="0.6" stroke="#059669" stroke-width="1"/>
    <text x="12" y="17" fill="#34d399" font-size="11" font-weight="700" letter-spacing="0.5">AGENT-NATIVE SCHEDULING</text>

    <!-- Brand & Title -->
    <text x="0" y="75" fill="#f4f4f5" font-size="44" font-weight="900" letter-spacing="-1.5">WhenFree</text>
    <text x="0" y="112" fill="#a1a1aa" font-size="16" font-weight="400" line-height="24">Zero-install multi-party scheduling platform</text>
    <text x="0" y="134" fill="#71717a" font-size="14" font-weight="400">designed for autonomous AI agents and humans.</text>

    <!-- Key Feature Pills -->
    <g transform="translate(0, 170)">
      <rect x="0" y="0" width="125" height="30" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
      <text x="14" y="19" fill="#e4e4e7" font-size="12" font-weight="600">Zero-Install</text>

      <rect x="135" y="0" width="135" height="30" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
      <text x="149" y="19" fill="#e4e4e7" font-size="12" font-weight="600">AI Delegation</text>

      <rect x="280" y="0" width="155" height="30" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
      <text x="294" y="19" fill="#e4e4e7" font-size="12" font-weight="600">Consensus Matrix</text>
    </g>

    <!-- Tech Badges -->
    <g transform="translate(0, 230)">
      <text x="0" y="16" fill="#52525b" font-size="12" font-family="monospace">STACK: Next.js 16 • Turso LibSQL • TypeScript • Tailwind</text>
    </g>
  </g>

  <!-- Right Visual Mockup: When2meet 2-Column Heatmap + AI Hero -->
  <g transform="translate(560, 55)">
    <!-- Main Window Mockup -->
    <rect width="580" height="370" rx="12" fill="#121215" stroke="#27272a" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect width="580" height="36" rx="12" fill="#18181b"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444" fill-opacity="0.8"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b" fill-opacity="0.8"/>
    <circle cx="52" cy="18" r="5" fill="#10b981" fill-opacity="0.8"/>
    <text x="210" y="22" fill="#71717a" font-size="11" font-family="monospace">whenfree.app/meet/team-sync</text>

    <!-- AI Hero Banner Mockup -->
    <rect x="20" y="52" width="540" height="52" rx="8" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
    <rect x="32" y="64" width="92" height="18" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="38" y="77" fill="#34d399" font-size="9" font-weight="700">RECOMMENDED</text>
    <text x="135" y="78" fill="#f4f4f5" font-size="12" font-weight="700">Delegate to AI Assistant (1-Click Prompt)</text>
    <text x="32" y="94" fill="#a8a29e" font-size="10">ChatGPT / Claude checks your calendar with 30m travel buffer</text>

    <!-- 2-Column Grid -->
    <g transform="translate(20, 116)">
      <!-- Left: Manual Paint -->
      <rect x="0" y="0" width="260" height="230" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1"/>
      <text x="14" y="24" fill="#f4f4f5" font-size="12" font-weight="700">Your Availability</text>
      <text x="14" y="38" fill="#71717a" font-size="9">Drag to paint time slots</text>

      <!-- Mini Painter Grid -->
      <g transform="translate(14, 52)">
        <rect x="0" y="0" width="30" height="20" rx="3" fill="#10b981" stroke="#34d399"/>
        <rect x="34" y="0" width="30" height="20" rx="3" fill="#10b981" stroke="#34d399"/>
        <rect x="68" y="0" width="30" height="20" rx="3" fill="#10b981" stroke="#34d399"/>
        <rect x="102" y="0" width="30" height="20" rx="3" fill="#18181b" stroke="#27272a"/>
        <rect x="136" y="0" width="30" height="20" rx="3" fill="#18181b" stroke="#27272a"/>
        <rect x="170" y="0" width="30" height="20" rx="3" fill="#10b981" stroke="#34d399"/>

        <rect x="0" y="24" width="30" height="20" rx="3" fill="#10b981" stroke="#34d399"/>
        <rect x="34" y="24" width="30" height="20" rx="3" fill="#f59e0b" stroke="#fbbf24"/>
        <rect x="68" y="24" width="30" height="20" rx="3" fill="#f59e0b" stroke="#fbbf24"/>
        <rect x="102" y="24" width="30" height="20" rx="3" fill="#18181b" stroke="#27272a"/>
        <rect x="136" y="24" width="30" height="20" rx="3" fill="#18181b" stroke="#27272a"/>
        <rect x="170" y="24" width="30" height="20" rx="3" fill="#10b981" stroke="#34d399"/>

        <rect x="0" y="48" width="30" height="20" rx="3" fill="#18181b" stroke="#27272a"/>
        <rect x="34" y="48" width="30" height="20" rx="3" fill="#18181b" stroke="#27272a"/>
        <rect x="68" y="48" width="30" height="20" rx="3" fill="#10b981" stroke="#34d399"/>
        <rect x="102" y="48" width="30" height="20" rx="3" fill="#10b981" stroke="#34d399"/>
        <rect x="136" y="48" width="30" height="20" rx="3" fill="#10b981" stroke="#34d399"/>
        <rect x="170" y="48" width="30" height="20" rx="3" fill="#18181b" stroke="#27272a"/>
      </g>
      <!-- Save Button -->
      <rect x="14" y="175" width="232" height="32" rx="6" fill="#f4f4f5"/>
      <text x="82" y="195" fill="#09090b" font-size="11" font-weight="700">Save Availability</text>

      <!-- Right: Group Consensus Heatmap -->
      <g transform="translate(275, 0)">
        <rect x="0" y="0" width="265" height="230" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1"/>
        <text x="14" y="24" fill="#f4f4f5" font-size="12" font-weight="700">Group Availability</text>
        <rect x="150" y="12" width="102" height="16" rx="4" fill="#451a03" stroke="#b45309" stroke-width="1"/>
        <text x="156" y="24" fill="#fbbf24" font-size="9" font-weight="700">Max 4/4 Available</text>

        <!-- Mini Group Grid with Amber Consensus Highlights -->
        <g transform="translate(14, 52)">
          <!-- Row 1 -->
          <rect x="0" y="0" width="32" height="20" rx="3" fill="#047857"/>
          <text x="12" y="14" fill="#fff" font-size="10" font-weight="700">2</text>

          <rect x="36" y="0" width="32" height="20" rx="3" fill="#065f46"/>
          <text x="48" y="14" fill="#fff" font-size="10" font-weight="700">1</text>

          <!-- Golden Best Cell -->
          <rect x="72" y="0" width="32" height="20" rx="3" fill="#fbbf24" stroke="#fef08a" stroke-width="1.5"/>
          <text x="84" y="14" fill="#09090b" font-size="10" font-weight="900">4</text>

          <rect x="108" y="0" width="32" height="20" rx="3" fill="#047857"/>
          <text x="120" y="14" fill="#fff" font-size="10" font-weight="700">2</text>

          <rect x="144" y="0" width="32" height="20" rx="3" fill="#18181b" stroke="#27272a"/>
          <rect x="180" y="0" width="32" height="20" rx="3" fill="#047857"/>
          <text x="192" y="14" fill="#fff" font-size="10" font-weight="700">2</text>

          <!-- Row 2 -->
          <rect x="0" y="24" width="32" height="20" rx="3" fill="#047857"/>
          <text x="12" y="38" fill="#fff" font-size="10" font-weight="700">2</text>

          <!-- Golden Best Cell -->
          <rect x="36" y="24" width="32" height="20" rx="3" fill="#fbbf24" stroke="#fef08a" stroke-width="1.5"/>
          <text x="48" y="38" fill="#09090b" font-size="10" font-weight="900">4</text>

          <!-- Golden Best Cell -->
          <rect x="72" y="24" width="32" height="20" rx="3" fill="#fbbf24" stroke="#fef08a" stroke-width="1.5"/>
          <text x="84" y="38" fill="#09090b" font-size="10" font-weight="900">4</text>

          <rect x="108" y="24" width="32" height="20" rx="3" fill="#059669"/>
          <text x="120" y="38" fill="#fff" font-size="10" font-weight="700">3</text>

          <rect x="144" y="24" width="32" height="20" rx="3" fill="#18181b" stroke="#27272a"/>
          <rect x="180" y="24" width="32" height="20" rx="3" fill="#059669"/>
          <text x="192" y="38" fill="#fff" font-size="10" font-weight="700">3</text>

          <!-- Row 3 -->
          <rect x="0" y="48" width="32" height="20" rx="3" fill="#18181b" stroke="#27272a"/>
          <rect x="36" y="48" width="32" height="20" rx="3" fill="#065f46"/>
          <text x="48" y="62" fill="#fff" font-size="10" font-weight="700">1</text>

          <rect x="72" y="48" width="32" height="20" rx="3" fill="#047857"/>
          <text x="84" y="62" fill="#fff" font-size="10" font-weight="700">2</text>

          <!-- Golden Best Cell -->
          <rect x="108" y="48" width="32" height="20" rx="3" fill="#fbbf24" stroke="#fef08a" stroke-width="1.5"/>
          <text x="120" y="62" fill="#09090b" font-size="10" font-weight="900">4</text>

          <rect x="144" y="48" width="32" height="20" rx="3" fill="#059669"/>
          <text x="156" y="62" fill="#fff" font-size="10" font-weight="700">3</text>

          <rect x="180" y="48" width="32" height="20" rx="3" fill="#047857"/>
          <text x="192" y="62" fill="#fff" font-size="10" font-weight="700">2</text>
        </g>

        <!-- Legend -->
        <g transform="translate(14, 185)">
          <rect x="0" y="0" width="10" height="10" rx="2" fill="#fbbf24"/>
          <text x="15" y="9" fill="#fbbf24" font-size="9" font-weight="700">Max Available</text>

          <rect x="90" y="0" width="10" height="10" rx="2" fill="#059669"/>
          <text x="105" y="9" fill="#a1a1aa" font-size="9">Partial</text>

          <rect x="150" y="0" width="10" height="10" rx="2" fill="#18181b" stroke="#3f3f46"/>
          <text x="165" y="9" fill="#71717a" font-size="9">Busy</text>
        </g>
      </g>
    </g>
  </g>
</svg>
